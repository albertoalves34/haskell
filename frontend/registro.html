<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - App de Dieta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .register-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box; /* Garante que o padding não aumente a largura */
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #218838;
        }
        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .sucesso { color: green; }
        .erro { color: red; }
    </style>
</head>
<body>

    <div class="register-container">
        <h2>Criar Conta</h2>
        
        <form id="registroForm">
            <div class="form-group">
                <label for="nome">Nome Completo:</label>
                <input type="text" id="nome" name="nome" required>
            </div>
            
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>
            
            <!-- Campos específicos para dieta podem ser adicionados aqui (peso, altura, etc) -->
            
            <button type="submit">Registrar</button>
        </form>

        <div id="mensagem"></div>
    </div>

    <script>
        // Intercepta o envio do formulário
        document.getElementById('registroForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Impede a página de recarregar

            // Pega os valores dos campos
            const nome = document.getElementById('nome').value;
            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;

            // Cria o objeto que será enviado em JSON para o Haskell
            const dadosUsuario = {
                nome: nome,
                email: email,
                senha: senha
            };

            const divMensagem = document.getElementById('mensagem');
            divMensagem.textContent = "Tentando registrar...";
            divMensagem.className = "";

            const urlBackend = window.location.origin + '/api/registro';

            // Faz a requisição POST para o backend
            fetch(urlBackend, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json' // Avisa o Haskell que estamos enviando JSON
                },
                body: JSON.stringify(dadosUsuario) // Converte o objeto JS para string JSON
            })
            .then(response => {
                if (response.ok) {
                    // Resposta com sucesso (código 200, 201)
                    divMensagem.textContent = "Usuário registrado com sucesso! Redirecionando...";
                    divMensagem.className = "sucesso";
                    document.getElementById('registroForm').reset();
                    setTimeout(() => { window.location.href = '/login'; }, 1500);
                } else {
                    // Resposta com erro (código 400, 500)
                    divMensagem.textContent = "Erro ao registrar usuário.";
                    divMensagem.className = "erro";
                }
            })
            .catch(error => {
                // Erro de conexão (ex: Servidor Haskell desligado ou erro de CORS)
                console.error('Erro na requisição:', error);
                divMensagem.textContent = "Erro na conexão com o servidor. Verifique se o Haskell está rodando.";
                divMensagem.className = "erro";
            });
        });
    </script>

</body>
</html>
