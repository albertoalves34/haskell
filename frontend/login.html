<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Dieta App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .login-container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 300px;
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            color: #666;
        }
        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        #mensagem {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
        .sucesso { color: green; }
        .erro    { color: red; }
        .link-registro {
            text-align: center;
            margin-top: 15px;
            color: #666;
            font-size: 14px;
        }
        .link-registro a {
            color: #007bff;
            text-decoration: none;
        }
        .link-registro a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <h2>Entrar</h2>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" required>
            </div>

            <button type="submit">Entrar</button>
        </form>

        <div id="mensagem"></div>

        <div class="link-registro">
            Não tem conta? <a href="/registro">Registre-se aqui</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();

            const email = document.getElementById('email').value;
            const senha = document.getElementById('senha').value;
            const divMensagem = document.getElementById('mensagem');

            divMensagem.textContent = "Verificando...";
            divMensagem.className = "";

            fetch(window.location.origin + '/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ loginEmail: email, loginPassword: senha })
            })
            .then(response => response.json().then(data => ({ ok: response.ok, data })))
            .then(({ ok, data }) => {
                if (ok && data.status === 'ok') {
                    divMensagem.textContent = "Login realizado com sucesso!";
                    divMensagem.className = "sucesso";
                    localStorage.setItem('userEmail', email);
                    localStorage.setItem('userId', data.userId);
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 1000);
                } else {
                    divMensagem.textContent = data.message || "Erro ao fazer login.";
                    divMensagem.className = "erro";
                }
            })
            .catch(error => {
                console.error('Erro na requisição:', error);
                divMensagem.textContent = "Erro na conexão com o servidor. Verifique se o servidor está rodando.";
                divMensagem.className = "erro";
            });
        });
    </script>

</body>
</html>
